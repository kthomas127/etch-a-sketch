<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etch-a-Sketch</title>
    <script src="scripts.js" defer></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="wrapper">
        <div class="header">
            <p>SKETCH PAD</p>
        </div>
        <div class="main-window">
            <div id="controls">
                <button data-tool="rainbow">Rainbow</button>
                <div id="penDiv">
                    <button data-tool='pen'>Pen</button>
                    <input type="color" id="colorPicker" value="#000000">
                </div>
                <!-- <button data-tool="fill">Fill</button> -->
                <button data-tool="eraser">Eraser</button>
                <p>Enter the number of pixels (max:100)</p>
                <input type="text" id="dimension">
                <button id="submitBtn">Resize</button>
                <button id="reset">Reset</button>
            </div>
            <div id="container">
                
            </div>
        </div>
    </div>
</body>
</html>
